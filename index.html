body {

.container {

.profile-img {

    border: 1px solid rgba(12, 4, 91, 0.2);
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.link-btn:hover {
    background-color: #ffffff;
    color: #0f2027;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);

footer {
